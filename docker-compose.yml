version: '3.8'

services:
  mingdi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mingdi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - mingdi-network
    restart: unless-stopped

  mingdi-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mingdi-frontend
    ports:
      - "80:80"
    depends_on:
      - mingdi-backend
    networks:
      - mingdi-network
    restart: unless-stopped

networks:
  mingdi-network:
    driver: bridge

volumes:
  data:
    driver: local
